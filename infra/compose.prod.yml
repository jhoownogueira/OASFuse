name: oasfuse

services:
  api:
    image: ${API_IMAGE:-oasfuse-api:local}
    build:
      context: ../backend
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/q/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  web:
    image: ${WEB_IMAGE:-oasfuse-web:local}
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3200}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
