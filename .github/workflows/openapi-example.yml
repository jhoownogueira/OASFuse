name: OASFuse contract gate example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f backend/pom.xml -pl cli -am package -DskipTests
      - name: Reject breaking contract changes
        run: >-
          java -jar backend/cli/target/oasfuse-cli.jar compare
          --baseline examples/basic/baseline.yaml
          --candidate examples/basic/candidate.yaml
          --format markdown
          --output oasfuse-report.md
          --fail-on breaking
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oasfuse-report
          path: oasfuse-report.md
