openapi: 3.0.3
info:
  title: Users API
  version: 1.1.0
paths:
  /users:
    get:
      operationId: getUsers
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /health:
    get:
      responses:
        "200":
          description: Healthy
components:
  schemas:
    User:
      type: object
      required: [id]
      properties:
        id:
          type: string
